<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vidriería Alpamayo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root>
      <!--
        Fallback shown only if Angular never starts (e.g. the file was opened
        from WebStorm's built-in server on port 63342 instead of `npm run dev`).
        Angular replaces this content as soon as it boots. It appears after a
        short delay so it never flashes during a normal load.
      -->
      <div style="font-family: Arial, sans-serif; max-width: 560px; margin: 15vh auto; padding: 24px; border: 1px solid #e6bdb8; border-radius: 2px; color: #191c1e; opacity: 0; animation: al-boot-hint 0s 3s forwards;">
        <style>@keyframes al-boot-hint { to { opacity: 1; } }</style>
        <h1 style="margin: 0 0 8px; font-size: 20px; color: #b91c1c;">La aplicación no arrancó</h1>
        <p style="margin: 0 0 12px; line-height: 1.5;">Esta página se abrió sin el servidor de Angular.</p>
        <ol style="margin: 0 0 12px; padding-left: 20px; line-height: 1.7;">
          <li>En la terminal del proyecto ejecuta <code>npm run dev</code>.</li>
          <li>Abre <a href="http://localhost:4200">http://localhost:4200</a> (no uses el ícono de navegador de WebStorm).</li>
          <li>Si sigue igual, pulsa Cmd + Shift + R.</li>
        </ol>
        <p style="margin: 0; font-size: 13px; color: #545f73;">Dirección actual: <script>document.write(location.href)</script></p>
      </div>
    </app-root>
  </body>
</html>
