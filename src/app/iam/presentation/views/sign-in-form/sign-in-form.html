<div class="form">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'iam.sign-in.title' | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (submit)="performSignIn()">
        <mat-form-field>
          <input matInput [placeholder]="'iam.sign-in.username' | translate" id="username" name="username" required formControlName="username" autocomplete="username">
          @if (isInvalidControl(form,'username')) {
            <mat-error>{{ errorMessagesForControl(form,'username')}}</mat-error>
          }
        </mat-form-field>
        <mat-form-field>
          <input matInput type="password" [placeholder]="'iam.sign-in.password' | translate" id="password" name="password" formControlName="password" autocomplete="current-password">
          @if (isInvalidControl(form,'password')) {
            <mat-error>{{ errorMessagesForControl(form,'password')}}</mat-error>
          }
        </mat-form-field>
        <button mat-raised-button color="primary">{{ 'iam.sign-in.submit' | translate }}</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
