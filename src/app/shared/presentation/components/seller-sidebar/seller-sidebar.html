<div class="sidebar-brand">
  <div class="brand-icon"><mat-icon>window</mat-icon></div>
  @if (!collapsed) {
    <div class="brand-text">
      <span class="brand-sub">Vidrieria</span>
        <span class="brand-name">Alpamayo</span>
        <span class="brand-tagline">Ventas Mayoristas</span>
    </div>
  }
</div>
<nav class="sidebar-nav">
  @for (option of options(); track option.link) {
    <a class="nav-item" [routerLink]="option.link" routerLinkActive="nav-item--active"
       [routerLinkActiveOptions]="{exact: false}"
       [matTooltip]="collapsed ? option.label : ''" matTooltipPosition="right">
      <mat-icon class="nav-icon">{{ option.icon }}</mat-icon>
      @if (!collapsed) { <span class="nav-label">{{ option.label }}</span> }
    </a>
  }
</nav>
<div class="sidebar-user">
  <div class="user-avatar" [matTooltip]="collapsed ? 'Carlos M. · Activo' : ''" matTooltipPosition="right">CM</div>
  @if (!collapsed) {
    <div class="user-info">
      <span class="user-name">Carlos M.</span>
      <span class="user-status"><span class="status-dot"></span>Activo</span>
    </div>
  }
</div>
