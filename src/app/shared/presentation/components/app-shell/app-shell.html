<div class="shell">
  <aside class="shell-sidebar" [class.shell-sidebar--collapsed]="collapsed()">
    <app-sidebar [collapsed]="collapsed()"/>
  </aside>
  <div class="shell-main">
    <header class="top-bar">
      <button mat-icon-button class="top-bar-btn" (click)="toggleSidebar()"
              [matTooltip]="collapsed() ? 'Expandir menú' : 'Comprimir menú'"
              [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Comprimir menú'">
        <mat-icon>{{ collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
      </button>
      <span class="top-bar-spacer"></span>
      <button mat-icon-button class="top-bar-btn" (click)="openConfiguration()"
              matTooltip="Configuración" aria-label="Configuración">
        <mat-icon>settings</mat-icon>
      </button>
    </header>
    <main class="shell-content"><router-outlet/></main>
  </div>
</div>
