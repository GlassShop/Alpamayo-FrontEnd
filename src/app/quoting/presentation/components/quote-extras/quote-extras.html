<div class="qe-head">
  <h3>{{ 'quotes.extras.title' | translate }}</h3>
  <span class="al-muted">{{ 'quotes.extras.hint' | translate }}</span>
  <button type="button" class="al-btn al-btn--secondary qe-add" (click)="quoting.addExtra()">
    <mat-icon>add</mat-icon>{{ 'quotes.extras.add' | translate }}
  </button>
</div>
@for (row of quoting.extraViews(); track row.extra.id; let i = $index) {
  <div class="qe-row">
    <div class="al-field qe-desc">
      <label class="al-label" [for]="'extra-desc-' + row.extra.id">{{ 'quotes.extras.description' | translate }}</label>
      <input class="al-input" [id]="'extra-desc-' + row.extra.id" maxlength="120" [value]="row.extra.description"
             [placeholder]="'quotes.extras.example' | translate" (input)="onChange(row.extra.id, 'description', $event)"/>
    </div>
    <div class="al-field qe-qty">
      <label class="al-label" [for]="'extra-qty-' + row.extra.id">{{ 'quoting.quantity' | translate }}</label>
      <input class="al-input" [id]="'extra-qty-' + row.extra.id" type="number" min="1" step="1" inputmode="numeric"
             [value]="row.extra.quantity" (input)="onChange(row.extra.id, 'quantity', $event)"/>
    </div>
    <div class="al-field qe-price">
      <label class="al-label" [for]="'extra-price-' + row.extra.id">{{ 'quotes.unit-price' | translate }} (S/)</label>
      <input class="al-input" [id]="'extra-price-' + row.extra.id" type="number" min="0.01" step="0.01" inputmode="decimal"
             [value]="row.extra.unitPrice ?? ''" (input)="onChange(row.extra.id, 'unitPrice', $event)"/>
    </div>
    <span class="qe-total">
      @if (row.total !== null) { S/ {{ row.total | number:'1.2-2' }} }
      @else { <span class="al-pill al-pill--warning">{{ 'quotes.extras.incomplete' | translate }}</span> }
    </span>
    <button type="button" class="al-icon-btn al-icon-btn--danger" (click)="quoting.removeExtra(row.extra.id)"
            [matTooltip]="'quoting.remove' | translate" [attr.aria-label]="('quoting.remove' | translate) + ' ' + (i + 1)">
      <mat-icon>delete_outline</mat-icon>
    </button>
  </div>
}
